# oh-my-api 示例配置
# 用法：复制为 config.yaml 后，替换下面的占位值（尤其是 API Key）

server:
  # API 服务监听地址（可省略，默认 :18000）
  listen: ":18000"

  # 可选：Prometheus 指标端口，留空表示关闭
  metrics_listen: "127.0.0.1:9090"

  # 日志级别：debug / info / warn / error
  log_level: "info"

  # 可选：全局请求超时（默认 120s），覆盖从发起到连接关闭的整个请求生命周期
  # timeout: "120s"

  # 可选：TCP + TLS 连接建立超时（默认 10s）
  # 仅控制网络连接建立阶段（DNS 解析、TCP 握手、TLS 握手），不包含等待响应的耗时
  # connect_timeout: "10s"

  # 可选：流式单 attempt 预算（默认 30s）
  # 从请求发出起算：等响应头 + 首个 SSE 事件共用该预算；超时则该 provider 失败并 failover
  # 对 failover / concurrent / load-balance / adaptive 均生效
  # prefill_timeout: "30s"

  # 可选：非流式单 attempt 预算（默认 120s，且不超过 server.timeout）
  # 等上游返回响应头（多数模型此阶段含完整生成）；超时则该 provider 失败并 failover
  # 与 prefill_timeout 独立，避免慢非流式被 30s 误杀
  # non_stream_timeout: "120s"

  # 可选：流式传输空闲超时（默认 60s）
  # 流式响应中，若上游连续 N 秒不发送任何数据，视为连接僵死并断开
  # 不影响非流式响应（非流式响应的上限由 non_stream_timeout / timeout 兜底）
  # stream_idle_timeout: "60s"

  # Provider 健康检查配置（供调度器在请求失败后判定可用性）
  health_check:
    failure_threshold: 3
    cooldown: "30s"

  # 可选：管理接口配置（若设置则启用 /admin 路由组）
  # admin:
  #   password: "your-admin-password"

database:
  # 可选。SQLite 文件路径（用于统计）
  path: "./data/oh-my-api.db"

inbound:
  auth:
    # 网关入口密钥（支持 Authorization: Bearer / x-api-key）
    keys:
      - name: "default"
        key: "sk-gateway-replace-this"

providers:
  # protocols / endpoints[].protocol 的写法规则：
  # - 必须使用标准写法："openai.chat"、"anthropic.messages"、"openai.responses"、"ollama.chat"、"ollama.embed"、"openai.embeddings"
  # - 多协议使用数组形式，例如：protocols: ["openai.chat", "anthropic.messages"]
  # - 注意："openai.response" 和 "anthropic.message" 这种单数写法无效
  # - 如果配置了 endpoints，则实际可到达的协议集合以 endpoints[].protocol 为准；protocols 只在未配置 endpoints 时作为回退
  # - 出站协议强制、reasoning effort 钳制、思考开关请使用顶层 rules（见下方 rules 示例）

  # Provider 名称会用于 model_groups 中的 "provider/model" 前缀
  openai:
    endpoint: "https://api.openai.com/v1"
    api_key: "sk-proj-replace-this"
    protocols: ["openai.chat"]
    rate_limit:
      qpm: 60

  anthropic:
    endpoint: "https://api.anthropic.com"
    api_key: "sk-ant-replace-this"
    protocols: ["anthropic.messages"]
    rate_limit:
      qpm: 50

  # 兼容 OpenAI 协议的第三方示例
  openrouter:
    endpoint: "https://openrouter.ai/api/v1"
    api_key: "sk-or-replace-this"
    protocols: ["openai.chat", "anthropic.messages"]
    rate_limit:
      qpm: 200

  # 可选：per-model QPM 与每日可用时段通过顶层 rules 配置（见下方 rules 示例），
  # 不要再写在 providers 里（providers.*.upstream_model 与 disabled_time_ranges 已废弃，Load 会直接拒绝）。
  # 示例：
  # example-provider:
  #   endpoint: "https://api.example.com"
  #   api_key: "sk-xxx"
  #   protocols: ["openai.chat"]

  # OpenAI Responses 专用上游示例
  responses-proxy:
    endpoint: "https://api.openai.com/v1"
    api_key: "sk-proj-replace-this"
    protocols: ["openai.responses"]
    rate_limit:
      qpm: 60

  # 可选：同一 provider 为不同协议提供不同 endpoint。
  # 如果 provider 声明了多协议，会优先直通与入方向相同的协议，否则按最低转换成本选择。
  # 一旦配置 endpoints，请确保每个需要实际使用的协议都在 endpoints[].protocol 中声明。
  # 例如下面这个 provider 实际可到达的协议就是 anthropic.messages / openai.chat / openai.responses。
  # coding-plan:
  #   endpoint: "https://api.example.com/fallback"
  #   endpoints:
  #     - url: "https://api.example.com/anthropic"
  #       protocol: "anthropic.messages"
  #     - url: "https://api.example.com/openai"
  #       protocol: "openai.chat"
  #     - url: "https://api.example.com/responses"
  #       protocol: "openai.responses"
  #   api_key: "sk-replace-this"

  # Ollama chat 示例：可被 /v1/chat/completions、/v1/messages、/v1/responses 统一路由
  # 纯 ollama.chat provider 允许空 api_key，endpoint 会自动补到 /api/chat
  ollama-chat:
    endpoint: "http://127.0.0.1:11434"
    api_key: ""
    protocols: ["ollama.chat"]
    rate_limit:
      qpm: 120

  # Ollama embedding 示例：仅用于 /v1/embeddings，不能与 chat 协议混用
  ollama-embed:
    endpoint: "http://127.0.0.1:11434"
    api_key: ""
    protocols: ["ollama.embed"]
    rate_limit:
      qpm: 120

  # OpenAI 兼容 embedding（llama-server / 其它 /v1/embeddings 上游）
  # endpoint 写 host root，或完整 .../v1/embeddings；不要写成 chat 常用的 .../v1
  llamacpp-embed:
    endpoint: "http://127.0.0.1:18080"
    api_key: ""
    protocols: ["openai.embeddings"]
    rate_limit:
      qpm: 120

  # 同容器本地 OAuth bridge 示例：OAuth access token 仅存在于容器内 bridge 状态目录。
  # local: true 仅允许 127.0.0.1、::1 或 localhost endpoint，且不使用 bridge bearer token。
  # xAI 官方同时支持 Responses API 和 OpenAI 兼容 Chat Completions，
  # protocols 可声明 "openai.responses"、"openai.chat" 或两者。
  # xai-bridge:
  #   endpoint: "http://127.0.0.1:8081"
  #   api_key: ""
  #   protocols: ["openai.responses", "openai.chat"]
  #   remote_bridge:
  #     enabled: true
  #     provider: "xai-oauth"
  #     local: true

  # 独立部署 OAuth bridge 时省略 local，并配置 token：
  # xai-oauth-bridge:
  #   endpoint: "http://bridge.local:8080"
  #   api_key: ""
  #   protocols: ["openai.responses", "openai.chat"]
  #   remote_bridge:
  #     enabled: true
  #     provider: "xai-oauth"
  #     token: "bridge-auth-token-replace-this"

model_groups:
  # 最简配置：单模型直连（不写 mode 时默认 failover）
  - name: "o3-mini"
    model: "openai/o3-mini"

  # 配置 context_length：优先于 catalog 文件中的值，省略时从 catalog 自动合并
  - name: "o3-mini-with-metadata"
    model: "openai/o3-mini"
    model_metadata:
      context_length: 200000

  # OpenAI Responses provider 示例：客户端依然请求这个 model_group 名
  - name: "gpt-4o-responses"
    model: "responses-proxy/gpt-4o"

  # 并发竞速：多个 provider 同时请求，谁先返回用谁
  - name: "gpt-4o-concurrent"
    mode: "concurrent"
    models:
      - "openai/gpt-4o"
      - "openrouter/openai/gpt-4o"

  # redirect 别名 `fast` 的目标模型组（单模型直连）
  - name: "gpt-4o-fast"
    model: "openai/gpt-4o"

  # 隐藏内部实现，仅通过 redirect 暴露别名（不可外部直调，仅被 redirect 引用）
  - name: "claude-fast"
    mode: "concurrent"
    exposure: internal
    models:
      - "anthropic/claude-sonnet-4-20250514"
      - "openrouter/anthropic/claude-sonnet-4-20250514"

  # 负载均衡：按权重分流
  - name: "gpt-4o-balanced"
    mode: "load-balance"
    models:
      - model: "openai/gpt-4o"
        weight: 3
      - model: "openrouter/openai/gpt-4o"
        weight: 1

  # 负载均衡 + sticky session：同一调用方在空闲窗口内粘到同一上游以利用缓存
  # sticky.enabled: 启用 sticky session（仅 load-balance 模式支持）
  # sticky.idle_timeout: 空闲超时时间，默认 10m（10 分钟）
  # 新会话使用 deficit 选择：优先选成功请求次数 / weight 最小的候选
  - name: "gpt-4o-sticky"
    mode: "load-balance"
    sticky:
      enabled: true
      idle_timeout: "10m"
    models:
      - model: "openai/gpt-4o"
        weight: 3
      - model: "openrouter/openai/gpt-4o"
        weight: 1

  # 故障转移：按列表顺序尝试，前者失败后才切换
  - name: "claude-failover"
    mode: "failover"
    models:
      - "anthropic/claude-sonnet-4-20250514"
      - "openrouter/anthropic/claude-sonnet-4-20250514"

  # 自适应调度：按 TTFT 历史择优选择，只支持 provider/model 叶子条目
  - name: "gpt-4o-adaptive"
    mode: "adaptive"
    models:
      - model: "openai/gpt-4o"
        weight: 1
      - model: "openrouter/openai/gpt-4o"
        weight: 1

  # 嵌套引用示例：顶层 failover 依次尝试两个子组
  # models 中不含 '/' 的条目视为对其他 model_group 或 redirect 的引用（内部名）
  # 注意：子组 models 引用的格式与直接引用 provider/model 语法相同
  - name: "claude-concurrent"
    mode: "concurrent"
    exposure: internal
    models:
      - "anthropic/claude-sonnet-4-20250514"
      - "openrouter/anthropic/claude-sonnet-4-20250514"

  - name: "gpt-concurrent"
    mode: "concurrent"
    exposure: internal
    models:
      - "openai/gpt-4o"
      - "openrouter/openai/gpt-4o"

  # 顶层 failover 引用两个子组：先整体尝试 claude-concurrent，失败后再整体尝试 gpt-concurrent
  - name: "smart-auto"
    mode: "failover"
    models:
      - "claude-concurrent"
      - "gpt-concurrent"

  # 本地 Ollama chat 模型示例
  - name: "llama3"
    model: "ollama-chat/llama3"

  # Embedding 模型示例：供 /v1/embeddings 使用
  # 注意：embeddings 仅支持纯叶子 group（不含子 group 引用）
  # 对包含子 group 引用的 group，/v1/embeddings 会返回 422 错误
  - name: "nomic-embed-text"
    model: "ollama-embed/nomic-embed-text"

  # OpenAI 兼容 embedding 示例（llama-server）
  - name: "llamacpp-embedding"
    model: "llamacpp-embed/embeddinggemma-300M-BF16.gguf"

# 可选：有序请求规则。每条规则至多一个 match 字段；action 至少一类、可多类并存。
# 空 match = GLOBAL（全站命中）。多规则全命中时不同类 action 相互叠加（叠层），
# 同类 action 按配置顺序后写覆盖前写；需要多条件时拆成多行独立规则（不是 AND）。
# - client-model：客户端原始 model（redirect / smart route 之前）
# - key：inbound.auth.keys[].name
# - upstream-model：provider/model-id（PlanLeaf 上的 provider 名 + upstream model）
# action 十类：protocol / effort / effort_mode / temperature_mode / thinking / max_tokens / qpm / enable_time_range / disable_time_range / retries。
# - protocol / effort / effort_mode / temperature_mode / thinking / max_tokens 是请求改写类，在物化时修改上游请求。
# - qpm / enable_time_range / disable_time_range / retries 是调度类，不修改请求：
#     * qpm 限制该上游身份的每分钟请求数（两层限流：先 provider 账号桶，再 rule per-model 桶），
#       只允许 upstream-model match（GLOBAL / client-model / key 会被校验拒绝）。
#     * enable_time_range / disable_time_range 限制可用时段（HH:MM-HH:MM，半开区间，支持跨午夜；
#       同一条内多个区间为 OR；两类同时命中时 AND）。
#     * retries 是同一叶子在瞬时失败（传输错误 / HTTP ≥500）后的额外次数，取值 0-2（总尝试最多 3 次）；
#       0 可覆盖更宽规则。timeout / 429 / 其它 4xx / 审核 / 额度不重试。GLOBAL / client-model / key 均可。
# effort 与 effort_mode: strip 同条互斥，需分两条规则表达。
# temperature_mode: strip 剔除请求里的 temperature（Chat / Responses / Anthropic 三种入站格式），
# 典型场景：上游模型不接受 temperature（如部分推理模型返回 400 Unsupported parameter: 'temperature'）。
# thinking: off 最后生效时会注入官方 none（并关闭各协议思考入口），覆盖更早的 effort 钳制；
# thinking: on 只用于覆盖先前的 off，单独出现不注入 enabled。
rules:
  # Provider 级默认出站协议（替代旧 default_protocols）
  - match:
      upstream-model: { op: startWith, value: "openrouter/" }
    action:
      protocol: openai.chat

  # 同一 upstream 可在一条 rule 上叠多类 action（减少重复 match）：
  # 协议强制 + per-model QPM + 可用时段。
  - match:
      upstream-model: { op: equals, value: "openrouter/minimax-m3" }
    action:
      protocol: anthropic.messages
      qpm: 120
      enable_time_range: ["09:00-18:00"]

  # reasoning effort 允许集（替代旧 upstream_model[].reasoning_effort）
  - match:
      upstream-model: { op: equals, value: "openrouter/deepseek-reasoner" }
    action:
      effort: [high, max]

  # 剔除 client effort（替代旧 reasoning_effort_mode: strip）
  - match:
      upstream-model: { op: equals, value: "openrouter/simple-model" }
    action:
      effort_mode: strip

  # 剔除 client temperature：上游模型不接受该参数时避免 400
  - match:
      upstream-model: { op: equals, value: "tcodex-local/gpt-5.6-terra" }
    action:
      temperature_mode: strip

  # max_tokens 下限钳制（floor）：请求未带或小于该值时补/提到配置值，
  # 请求已带且大于该值时保持不动。典型场景：思考型视觉模型（如 deepseek-v4-flash-vision-exp）
  # 会把小 max_tokens 预算全耗在 reasoning 上导致 content 为空，需保证输出预算下限。
  # 支持 Chat（max_tokens / max_completion_tokens）、Responses（max_output_tokens）、Anthropic（max_tokens）。
  - match:
      upstream-model: { op: startWith, value: "token-hub/deepseek/deepseek-v4-flash-vision" }
    action:
      max_tokens: 2000

  # 每日禁用时段：当前时间落在任一区间内时该 leaf 被跳过；跨午夜区间用 23:00-02:00。
  - match:
      upstream-model: { op: equals, value: "openrouter/gpt-4o-mini" }
    action:
      disable_time_range: ["23:00-02:00"]

  # 瞬时失败时同一叶子再打一次（retries: 1 → 总共最多 2 次）；耗尽后再走 failover 下一家。
  - match:
      upstream-model: { op: startWith, value: "openrouter/" }
    action:
      retries: 1

  # 关闭思考：Chat 注入 reasoning_effort=none；Responses 注入 reasoning.effort=none；
  # Anthropic 写 thinking.type=disabled 并剔除 output_config.effort。
  # 以下两行是两条独立规则，各自命中即生效，互不为条件（不是 AND）：
  # client-model 命中、或 key 命中，都会关闭思考。
  - match:
      client-model: { op: equals, value: "claude-fast" }
    action:
      thinking: off
  - match:
      key: { op: startWith, value: "cc-" }
    action:
      thinking: off

# 可选：别名重定向（支持两种格式）
# 推荐使用新格式（slice），支持 exposure 配置
# exposure 取值：public（列表展示且可直调，默认）/ hidden（不展示但可直调）/ internal（不展示且不可直调，仅内部引用）
redirect:
  # 新格式示例：
  - source: claude-4-6-20261201
    target: smart-auto
    # exposure: public  # 默认值，可省略

  - source: gpt-4o
    target: gpt-4o-balanced
    exposure: hidden  # 不在模型列表展示，但允许直接调用

  - source: fast
    target: gpt-4o-fast
    # exposure 默认 public

  # 旧格式（map）仍然支持，但无法配置 exposure（默认 public）：
  # my-embed: nomic-embed-text

# 可选：smart route 配置（仅在显式启用的 alias 上生效）
# smart_route:
#   cheap: cheap-judge        # 判别器模型，仅用于 judge，不承载最终请求
#   scout: scout-collector    # 探路模型，用于收集第一轮对话信息
#   enabled_models:           # 显式启用 smart route 的入口模型名列表，可写 alias 或 model group
#     - claude-4-6-20261201

# 可选：Cascade hub-spoke（应用层 WSS 会话，不是通用隧道；同一进程 hub 与 spoke 互斥）
#
# Hub 侧：在 providers 增加 cascade.enabled provider（无 endpoint，三种协议，token 与 spoke 共享）
#   corp-dev:
#     # endpoint 留空；启用 cascade 后不会对该 provider 发起 HTTP 拨号
#     protocols: ["openai.chat", "openai.responses", "anthropic.messages"]
#     cascade:
#       enabled: true
#       token: "replace-with-shared-cascade-secret"
#
# Spoke 侧（开发机出站连 hub，仅出站 443/WSS）：
# cascade:
#   hub: "https://api.example.com"   # 仅 origin（http/https），不要写 /cascade 或 ws(s)://
#   token: "replace-with-shared-cascade-secret"
#   peer: "openrouter"               # 已有 providers 键名；cascade job 执行时跳过该 provider 防环
# 注意：spoke 不再有 offer 白名单。hub 可调用的入口由 exposure 决定——
# 所有 public 与 hidden 的 model_group / redirect 都会自动同步给 hub（含可选 context_length），
# internal 一律不可被 hub 调用。历史配置中的 cascade.offer 会被加载/Apply 硬拒绝。
#
# model_groups 示例（hub 把 corp-dev 叶子加入组后，客户端经 hub 调用内网模型）：
#   - name: "corp-dev-chat"
#     models:
#       - model: "corp-dev/local-gpt"
#
# 开发机示例（public 或 hidden group/redirect 均会被同步给 hub；hidden 不展示但可直调）：
#   - name: "local-gpt"
#     models:
#       - model: "ollama-chat/llama3"
