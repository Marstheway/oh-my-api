{{ define "title" }}Providers{{ end }}

{{ define "page_head" }}
  <link rel="stylesheet" href="/admin/static/providers.css">
{{ end }}

{{ define "styles" }}{{ end }}

{{ define "content" }}
<div class="page-header">
  <div>
    <div class="page-title">Providers</div>
    <div class="page-subtitle">Upstream API connections and protocol configuration</div>
  </div>
  <div class="page-actions">
    <button class="btn btn-primary" onclick="openProviderModal()">
      <i data-lucide="plus" style="width:13px;height:13px"></i>
      New Provider
    </button>
  </div>
</div>

{{ template "draft-bar" }}

<!-- Providers Grid -->
<div class="provider-grid" id="providerGrid"></div>

<!-- Empty State -->
<div class="empty-state" id="emptyState" style="display:none">
  <div class="empty-icon">&#x2630;</div>
  <div class="empty-title">No providers configured</div>
  <button class="btn btn-primary btn-sm" onclick="openProviderModal()">Create First Provider</button>
</div>
{{ end }}

{{ define "scripts" }}
<script src="/admin/static/providers.js"></script>
{{ end }}
