services:
  oh-my-api:
    image: oh-my-api:${IMAGE_TAG}
    container_name: oh-my-api
    command: ["--config", "/app/config/config.yaml", "serve"]
    ports:
      - "127.0.0.1:18000:18000"
    environment:
      HOME: /data/bridge
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./bridge-data:/data/bridge
    networks:
      - default
      - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Prometheus / Grafana 作为独立基础设施单独部署，不包含在本 compose 内。
# 本服务只需加入外部网络 observability，并保证 metrics_listen 对容器网卡可达
# （推荐 ":9090"，勿用 127.0.0.1:9090）。
# 首次部署需先创建该网络：docker network create observability
# 再将本服务登记为监控栈的 scrape 目标。

networks:
  observability:
    external: true
